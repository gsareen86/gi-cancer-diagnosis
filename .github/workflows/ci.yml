name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest

    services:
      postgres:
        # The data-layer tests assert database behaviour — append-only audit privileges, partial
        # unique indexes, pgvector retrieval. Mocking those would only assert the mock.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gi_compass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gi_compass
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gi_compass
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npx tsx packages/db/src/migrate.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build -w @gi-compass/web

  python:
    name: AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4

      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Test
        # No network: the model client is exercised against a recording double, which is what
        # lets these assertions be about the request shape rather than a live provider's mood.
        run: .venv/bin/python -m pytest -q
