schema: spec-driven

context: |
  GI Compass: GI specialty navigation and clinician decision support in India.
  Current product authority: docs/specialty-navigation/brief.md (2026-09-13).
  Start each session with docs/specialty-navigation/START-HERE.md and ONE selected
  OpenSpec change. Historical discussions and docs/history are not the current backlog.

  Intended use: collect patient history, symptoms and optional existing reports;
  help a clinician assess possible causes, suitable specialty and urgency; release
  clinician-reviewed navigation instructions to the patient. No early-detection,
  cancer-screening, autonomous diagnosis or treatment claim. AI differentials,
  including malignancy hypotheses, are clinician-only in v1.

  First sites: the clinical lead's own clinic and proposed Metro pilot. Metro has
  not approved a pilot. Tablet self-service and coordinator-assisted tablet intake;
  full desktop clinician workspace and responsive phone web. Phone OTP, WhatsApp,
  named-doctor directories, e-prescribing and emergency calling/SOS are out of v1.
  Immediate-care advice remains available without waiting for AI or review.

  Product owner: user, building through their IT company; IP ownership is their
  stated intent. The company is the proposed primary data fiduciary, subject to
  actual purposes, site agreements and applicable law. Personally sourced records
  are not automatically authorised for development, evaluation or processing.
  Local demo: synthetic data and local inference. Real-data pilot: approved India
  hosting and Azure OpenAI processing, with deployment geography, terms, retention,
  consent and site authority verified. No Global/DataZone/provider fallback that
  breaks India-only processing. No cloud resource or expense without authorisation.

  Clinical lead authors and signs off wording, value sets and urgency rules. Draft
  content stays unpublished; AI suggestions never count as clinical approval.
  Version clinical data, source facts, prompts/models and released documents.
  An AI result cannot lower the deterministic urgency floor. Unknown/omitted and
  machine-extracted facts are distinct from patient denials or verified findings.
  Partial intake must preserve advice and uncertainty, not imply serious disease
  is absent. No fixed clinical deadlines or numerical priors invented by developers.

  Retain audited, consent-checked data access and API authorisation; tablet sessions
  must isolate patients, sites and coordinators. No PHI in logs, browser persistence,
  analytics, fixtures or prompts to coding agents. Approved release is explicit and
  tied to the reviewed source version. Clinical agreement and OPD time saved are the
  pilot outcomes; agreement with one reviewer is not diagnostic accuracy.

  Existing stack: npm workspaces; Next.js 15, strict TypeScript, Tailwind, next-intl;
  Zod domain contracts in packages/core; Drizzle/PostgreSQL in packages/db; Python
  FastAPI AI service with local inference. Reuse only after testing against the new
  scope. Supabase is not adopted. No rewrite or provider migration by implication.
  Refer to docs/specialty-navigation/implementation-plan.md for bounded changes.
  Regulatory applicability is a dated evidence question, not a compliance badge.

rules:
  proposal:
    - State user-visible scope and exclusions; distinguish prototype, demo and real-data pilot.
    - Include Non-goals; do not add diagnosis, prescribing, directory or emergency dispatch.
  specs:
    - Use testable MUST/SHALL requirements and Given/When/Then scenarios.
    - Clinical-data requirements include authorisation, consent, audit and cross-patient/site denial scenarios.
    - Safety requirements include unknown inputs, partial intake, model failure and unsafe-path rejection.
    - Distinguish a clinical content approval from a passing software test.
  design:
    - Document reuse versus replacement and data migration/rollback; no silent stack changes.
    - Identify open decisions by ID from the current brief and separate demo defaults from pilot gates.
  tasks:
    - Keep the change bounded; map independently verifiable tasks to requirements and evidence.
    - Leave tasks unchecked until implemented and verified; historical completion is not new evidence.

operations:
  apply:
    guidance:
      - Read START-HERE and only the selected change plus directly relevant code.
      - Add failing tests before changing safety, access, publication or clinical-output boundaries.
      - Never let AI, report processing or an account gate delay immediate-care advice.
  archive:
    guidance:
      - Record checks and remaining clinical/site approvals; never archive incomplete work as delivered.
