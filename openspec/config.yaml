schema: spec-driven

context: |
  GI Compass: clinic intake, patient-visible preliminary AI assessment and clinician review, India.
  Product authority: docs/product-brief.md (decisions dated 2026-09-13).
  Work on ONE change per session; read only that change plus directly relevant code.

  Intended use (DRAFT, pending regulatory review): collect an adult patient's GI symptoms,
  history and optional reports; provide the patient an explicitly preliminary AI assessment
  with possible diagnoses, factual reasoning, uncertainty and next steps before clinician
  review. A practitioner separately reviews the encounter and records their assessment.
  Never present AI output as a confirmed diagnosis or validated cancer-screening result.

  Pilot: the clinical lead's own clinic, then Metro Hospital OPD (not yet approached).
  Tablet intake, patient self-service or coordinator-assisted. Full desktop clinician
  workspace; phone browsers supported, each layout designed for its device.
  Patient output: preliminary AI assessment and navigation, followed by a distinct clinician
  assessment. Urgency never falls below the deterministic floor.

  Stack: Next.js (App Router) + strict TypeScript; Supabase (Postgres, Auth, Storage, RLS),
  the owner's Supabase Cloud account for both the synthetic demo and later pilot;
  separate approved projects, with India region verified before use. No local Docker
  Supabase setup or fallback. The web app and demo LLM run locally. Credentials go in
  ignored .env; privileged keys never reach browser code. Every model call goes
  through the LLM Gateway (docs/reference/llm-gateway.md): local llama.cpp for the demo,
  Azure OpenAI regional deployment in India for the pilot. Demo uses synthetic data only.

  Clinical content (questions, patient wording, value sets, urgency rules, specialty
  mapping) is authored and signed off by the clinical lead. Developers and AI agents draft
  and mark content DRAFT; they never approve it.

  Safety invariants. No change may violate these:
  S1  Urgency floor: deterministic rules set a minimum urgency without AI. AI output MAY
      raise urgency; it MUST NOT lower it below the floor.
  S2  No reassurance: no patient-facing output states or implies the absence of serious
      disease or that no action is needed.
  S3  A human closes every case. The system ranks and surfaces; only a clinician
      dispositions. Low-priority cases remain in a reviewed queue, never discarded.
  S4  Rule matches, not probabilities: urgency is explained by the matched rules and the
      facts that triggered them. No numeric or graded (high/moderate/low) likelihood for
      any condition is generated or displayed in v1.
  S5  Patient-visible preliminary AI assessment is permitted without case-by-case clinician
      approval. Label AI authorship and unreviewed status; give possible diagnoses, relevant
      source facts, missing/conflicting evidence and next steps in plain language. Never
      imply confirmation, exclude serious disease, invent evidence or claim clinician review.
      Preserve a distinct, versioned clinician-reviewed assessment; never silently overwrite.
  S6  Immediate-care advice never waits for AI, report processing or login.
  S7  Pre-consent abandonment receives generic advice without storing clinical answers.
      A consented incomplete encounter stays assigned for human review with conservative
      advice. Unknown or declined answers are never "no". Missing/failed AI yields an honest
      unavailable/incomplete state, never a fabricated preliminary diagnosis.
  S8  Extracted report fields are proposals carrying document, page, source text, confidence
      and verification status; they never silently overwrite patient or clinician entries.
  S9  AI hypothesis generation MUST explicitly consider region-relevant infectious and
      inflammatory causes, abdominal tuberculosis at minimum, stating available evidence
      for/against or explicitly unknown; no forced inclusion without supporting facts.
  S10 Clinical logic is versioned data (author, approver, date), never hardcoded in code or
      buried in prompts. Every clinical parameter carries provenance:
      assumed | guideline-derived | locally-validated.

  Data invariants:
  D1  Every PHI read and write is audit-logged with actor, timestamp, purpose and record.
  D2  PHI rows are site-scoped; RLS enforces site and role isolation. Tablet sessions are
      encounter-scoped and fully reset between patients.
  D3  Versioned DPDP notice and consent are recorded before any clinical data is captured.
  D4  India only: data at rest in India; model egress only through the LLM Gateway to a
      connector approved for the environment; never a silent provider fallback.
  D5  No real patient data in the repository, fixtures, logs, analytics, screenshots or
      prompts to coding agents.

  Not in v1: confirmed autonomous AI diagnosis, probabilities, screening or early-detection
  claims, public website, referring-GP channel, WhatsApp/native apps, ABDM, e-prescribing,
  named-doctor recommendations, emergency dispatch.

rules:
  proposal:
    - State whether the change serves the synthetic demo, the real-data pilot, or both.
    - List the invariants (S1-S10, D1-D5) the change touches and how it upholds each.
    - Include Non-goals.
  specs:
    - Use RFC 2119 keywords and Given/When/Then scenarios readable by the clinical lead.
    - Clinical behaviour covers unknown/declined answers, partial intake, AI unavailable and AI proposing lower urgency.
    - PHI access covers cross-site and cross-patient denial and the resulting audit entry.
    - Clinical values in scenarios are marked DRAFT unless an approved content version is cited.
  design:
    - Record decisions with rejected alternatives; justify every new dependency or service.
    - Tag each clinical parameter with provenance (assumed, guideline-derived, locally-validated).
  tasks:
    - Small, independently verifiable tasks; write failing tests first for safety, access and clinical-output boundaries.
    - End with a cross-model review task (the agent that did not author the change reviews it) and record its findings.
